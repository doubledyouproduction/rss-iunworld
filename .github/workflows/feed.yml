name: Instagram RSS Feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed bauen
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python build_feed.py

      - name: Aenderungen speichern
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Feed aktualisiert"
            git push
          fi
